<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Productos - Autenticación JWT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 900px; background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    h1 { text-align: center; margin-bottom: 8px; color: #38bdf8; font-size: 1.8rem; }
    p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #334155; color: #cbd5e1; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .tab-btn.active { background: #0284c7; color: #fff; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 0.95rem; }
    input:focus { outline: none; border-color: #38bdf8; }
    button.primary { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #0284c7; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    button.primary:hover { background: #0369a1; }
    button.danger { padding: 8px 14px; border: none; border-radius: 6px; background: #dc2626; color: #fff; cursor: pointer; font-weight: 600; }
    button.edit { padding: 6px 10px; border: none; border-radius: 6px; background: #d97706; color: #fff; cursor: pointer; margin-right: 6px; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 0.9rem; }
    .alert.success { background: rgba(22, 163, 74, 0.2); border: 1px solid #16a34a; color: #86efac; }
    .alert.error { background: rgba(220, 38, 38, 0.2); border: 1px solid #dc2626; color: #fca5a5; }
    .hidden { display: none; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
    .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    th { color: #38bdf8; background: #0f172a; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sistema de Gestión de Productos</h1>
    <p class="subtitle">Node.js · Express · MongoDB · Autenticación JWT</p>

    <div id="alerta" class="alert"></div>

    <div id="auth-section">
      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="mostrarTab('login')">Iniciar Sesión</button>
        <button class="tab-btn" id="tab-register" onclick="mostrarTab('register')">Registrarse</button>
      </div>

      <form id="form-login" onsubmit="iniciarSesion(event)">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="login-email" placeholder="usuario@correo.com" required />
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••" required />
        </div>
        <button type="submit" class="primary">Ingresar al Sistema</button>
      </form>

      <form id="form-register" class="hidden" onsubmit="registrarUsuario(event)">
        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" id="reg-nombre" placeholder="German Gastelum" required />
        </div>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="reg-email" placeholder="usuario@correo.com" required />
        </div>
        <div class="form-group">
          <label>Contraseña (mínimo 6 caracteres)</label>
          <input type="password" id="reg-password" minlength="6" placeholder="••••••" required />
        </div>
        <button type="submit" class="primary">Crear Cuenta</button>
      </form>
    </div>

    <div id="app-section" class="hidden">
      <div class="header-bar">
        <div>
          <strong id="user-info" style="color:#38bdf8;">Sesión activa</strong>
          <div style="font-size:0.8rem; color:#94a3b8;">Rutas protegidas mediante JWT Bearer</div>
        </div>
        <button class="danger" onclick="cerrarSesion()">Cerrar Sesión</button>
      </div>

      <form id="form-producto" onsubmit="guardarProducto(event)">
        <input type="hidden" id="prod-id" />
        <div class="grid-form">
          <input type="text" id="prod-nombre" placeholder="Nombre del producto" required />
          <input type="text" id="prod-descripcion" placeholder="Descripción" required />
          <input type="number" step="0.01" id="prod-precio" placeholder="Precio ($)" required />
          <input type="text" id="prod-categoria" placeholder="Categoría" required />
          <input type="number" id="prod-stock" placeholder="Stock" value="1" required />
        </div>
        <button type="submit" class="primary" id="btn-guardar-prod">Agregar Producto</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-productos"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = '/api';

    function mostrarAlerta(mensaje, tipo) {
      const alerta = document.getElementById('alerta');
      alerta.textContent = mensaje;
      alerta.className = `alert ${tipo}`;
      alerta.style.display = 'block';
      setTimeout(() => { alerta.style.display = 'none'; }, 4000);
    }

    function mostrarTab(tab) {
      document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
      document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    }

    async function registrarUsuario(e) {
      e.preventDefault();
      const nombre = document.getElementById('reg-nombre').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      const res = await fetch(`${API_URL}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, email, password })
      });
      const data = await res.json();
      if (res.ok) {
        mostrarAlerta('Usuario registrado. Ahora inicia sesión.', 'success');
        document.getElementById('form-register').reset();
        mostrarTab('login');
      } else {
        mostrarAlerta(data.error || 'Error al registrar', 'error');
      }
    }

    async function iniciarSesion(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const res = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));
        mostrarAlerta('Bienvenido al sistema', 'success');
        verificarEstadoSesion();
      } else {
        mostrarAlerta(data.error || 'Credenciales incorrectas', 'error');
      }
    }

    async function cerrarSesion() {
      const token = localStorage.getItem('token');
      await fetch(`${API_URL}/auth/logout`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` }
      });
      localStorage.removeItem('token');
      localStorage.removeItem('usuario');
      verificarEstadoSesion();
      mostrarAlerta('Sesión cerrada correctamente', 'success');
    }

    async function cargarProductos() {
      const token = localStorage.getItem('token');
      const res = await fetch(`${API_URL}/productos`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) return;
      const productos = await res.json();
      const tbody = document.getElementById('tabla-productos');
      tbody.innerHTML = productos.map(p => `
        <tr>
          <td>${p.nombre}</td>
          <td>${p.descripcion}</td>
          <td>${p.categoria}</td>
          <td>$${Number(p.precio).toFixed(2)}</td>
          <td>${p.stock}</td>
          <td>
            <button class="edit" onclick='editarProducto(${JSON.stringify(p)})'>Editar</button>
            <button class="danger" onclick="eliminarProducto('${p._id}')">Eliminar</button>
          </td>
        </tr>
      `).join('');
    }

    async function guardarProducto(e) {
      e.preventDefault();
      const token = localStorage.getItem('token');
      const id = document.getElementById('prod-id').value;
      const payload = {
        nombre: document.getElementById('prod-nombre').value,
        descripcion: document.getElementById('prod-descripcion').value,
        precio: Number(document.getElementById('prod-precio').value),
        categoria: document.getElementById('prod-categoria').value,
        stock: Number(document.getElementById('prod-stock').value)
      };

      const url = id ? `${API_URL}/productos/${id}` : `${API_URL}/productos`;
      const method = id ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (res.ok) {
        mostrarAlerta(data.mensaje, 'success');
        document.getElementById('form-producto').reset();
        document.getElementById('prod-id').value = '';
        document.getElementById('btn-guardar-prod').textContent = 'Agregar Producto';
        cargarProductos();
      } else {
        mostrarAlerta(data.error || 'Error al guardar producto', 'error');
      }
    }

    function editarProducto(p) {
      document.getElementById('prod-id').value = p._id;
      document.getElementById('prod-nombre').value = p.nombre;
      document.getElementById('prod-descripcion').value = p.descripcion;
      document.getElementById('prod-precio').value = p.precio;
      document.getElementById('prod-categoria').value = p.categoria;
      document.getElementById('prod-stock').value = p.stock;
      document.getElementById('btn-guardar-prod').textContent = 'Actualizar Producto';
    }

    async function eliminarProducto(id) {
      const token = localStorage.getItem('token');
      const res = await fetch(`${API_URL}/productos/${id}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      if (res.ok) {
        mostrarAlerta(data.mensaje, 'success');
        cargarProductos();
      } else {
        mostrarAlerta(data.error || 'Error al eliminar', 'error');
      }
    }

    function verificarEstadoSesion() {
      const token = localStorage.getItem('token');
      const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
      if (token && usuario) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-info').textContent = `Usuario: ${usuario.nombre} (${usuario.email})`;
        cargarProductos();
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
      }
    }

    verificarEstadoSesion();
  </script>
</body>
</html>
